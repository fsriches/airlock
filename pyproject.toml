[project]
name = "airlock"
version = "0.1.0"
description = "Six-chamber trade gate for the official Binance MCP Server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
airlock = "airlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]
